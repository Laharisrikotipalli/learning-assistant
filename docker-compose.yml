services:
  ollama:
    image: ollama/ollama
    container_name: studybuddy-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4

  clawtutor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawtutor-openclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - ollama
    volumes:
      - memory_data:/data/memory
      - ./skills:/app/skills:ro
      - ./config/openclaw.json:/root/.openclaw/openclaw.json:ro

volumes:
  memory_data:
  ollama_data: